[workspace]
resolver = "2"
members = [
    "crates/hephos",
    "crates/hephos-core",
    "crates/hephos-db",
    "crates/hephos-agent",
    "crates/hephos-mcp",
    "examples/rest",
    "examples/auth",
    "examples/database",
    "examples/websocket",
    "examples/streaming",
    "examples/agent",
    "examples/tools",
    "examples/workflow",
    "examples/mcp",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arthurlch/hephos"

# One pinned version per dependency, declared once, inherited everywhere.
# Adding a dependency here is a deliberate, reviewed act (see CONVENTIONS.md).
[workspace.dependencies]
hephos = { path = "crates/hephos" }
hephos-core = { path = "crates/hephos-core" }
hephos-db = { path = "crates/hephos-db" }
hephos-agent = { path = "crates/hephos-agent" }
hephos-mcp = { path = "crates/hephos-mcp" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "limit"] }
axum = { version = "0.8", features = ["ws", "macros"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
futures = "0.3"

# database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "migrate"] }

# auth
jsonwebtoken = "11"
argon2 = "0.6"

# agent / tools
schemars = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-stream = "0.3"

# mcp
rmcp = { version = "3.5", features = ["server", "transport-io", "transport-streamable-http-server"] }

# Faster edit→check→test loop for agents: line-tables-only debuginfo links much
# faster than full debuginfo while keeping backtraces and line numbers.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
