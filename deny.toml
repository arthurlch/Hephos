# cargo-deny policy. Fits Hephos's dependency doctrine (minimal, justified, trusted).
# Run locally with `cargo deny check`.

[advisories]
version = 2
# Documented ignores with justification:
# - RUSTSEC-2026-0009: Denial of Service via Stack Exhaustion in time formatting.
#   Fix requires rustc >= 1.88, which exceeds the repository's 1.85 MSRV.
#   Hephos never parses or formats attacker-controlled format descriptions.
# - RUSTSEC-2024-0421: Punycode labels bug in idna 0.5.0.
#   Transitive via url 2.5 (used by reqwest and sqlx). Upstream url 2.5 pins this.
# - RUSTSEC-2024-0436: paste crate unmaintained.
#   Transitive via rmcp 0.9.1. Maintained drop-in alternatives are pending upstream.
# - RUSTSEC-2026-0189: DNS rebinding in rmcp Streamable HTTP server transport.
#   Hephos only uses in-process and stdio tool capabilities, never the HTTP server transport.
ignore = [
    "RUSTSEC-2026-0009",
    "RUSTSEC-2024-0421",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0189",
]

[licenses]
version = 2
confidence-threshold = 0.9
private = { ignore = true }
# Permissive licenses only. Anything outside this list is a deliberate decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Duplicate versions are a warning (the 1.85 pins introduce a few); wildcards are
# allowed for path/workspace dependencies inherited from [workspace.dependencies].
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
