name: Release

# Tag a release to trigger this: `git tag v0.0.2 && git push origin v0.0.2`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: never cut a release on red. Re-run the offline suite against the tag.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: >-
          cargo clippy --locked --all-targets --all-features
          --workspace --exclude example-database --exclude example-auth -- -D warnings
      - run: >-
          cargo test --locked --all-features
          --workspace --exclude example-database --exclude example-auth

  release:
    name: github release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the body between `## [VERSION]` and the next `## [` heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section for ${VERSION}; using autogenerated notes." > RELEASE_NOTES.md
            echo "autogenerate=true" >> "$GITHUB_OUTPUT"
          else
            echo "autogenerate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: ${{ steps.notes.outputs.autogenerate }}
          # Every 0.x tag (and any pre-release suffix) is marked pre-release.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}

  # Opt-in crates.io publish. Skips cleanly unless CARGO_REGISTRY_TOKEN is set in
  # repo secrets. NOTE: before this can succeed, the internal `rivet-*` path deps
  # must also carry versions (see RELEASING.md).
  publish:
    name: crates.io (opt-in)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          for crate in rivet-core rivet-db rivet-agent rivet-mcp rivet; do
            echo "Publishing ${crate}…"
            cargo publish --locked -p "${crate}"
            sleep 20  # let the index settle before the next dependent crate
          done
