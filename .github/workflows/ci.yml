name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Offline crates: everything that builds without a database.
  OFFLINE: --workspace --exclude example-database --exclude example-auth

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features $OFFLINE -- -D warnings

  test:
    name: test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features $OFFLINE

  docs:
    name: docs build
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo doc --locked --no-deps --all-features
          -p rivet -p rivet-core -p rivet-db -p rivet-agent -p rivet-mcp

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Every combination of the meta crate's features must compile.
      - run: cargo hack --locked --feature-powerset --no-dev-deps check -p rivet

  database:
    name: db examples (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prepare example-database schema
        run: |
          createdb rivet_db
          psql -d rivet_db -f examples/database/migrations/0001_init.sql
      - name: Build & test example-database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rivet_db
        run: |
          cargo clippy --locked -p example-database --all-targets -- -D warnings
          cargo test --locked -p example-database -- --include-ignored

      - name: Prepare example-auth schema
        run: |
          createdb rivet_auth
          psql -d rivet_auth -f examples/auth/migrations/0001_init.sql
      - name: Build & test example-auth
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rivet_auth
        run: |
          cargo clippy --locked -p example-auth --all-targets -- -D warnings
          cargo test --locked -p example-auth -- --include-ignored

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
