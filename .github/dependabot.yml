version: 2
updates:
  # Cargo dependencies are pinned once in [workspace.dependencies]; group the noise
  # into a single weekly PR so review stays cheap.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
