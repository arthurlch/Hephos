[package]
name = "hephos-db"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hephos database layer: Db and Tx over SQLx/Postgres."

[dependencies]
# `sqlx` feature gives `From<sqlx::Error> for hephos::Error`, so repos can use `?`.
hephos-core = { workspace = true, features = ["sqlx"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# For unique disposable-test-database names (see `test::TestDb`) and job IDs.
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
