[package]
name = "rivet-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet core: App, Ctx, Error, Router, extractors, config, tasks, events."

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
# Optional: only to provide `From<sqlx::Error> for Error`. Core stays sqlx-free
# unless a db-using crate turns this on (rivet-db does).
sqlx = { workspace = true, optional = true }

[features]
# Enables `From<sqlx::Error> for Error` so repositories can use `?` directly.
sqlx = ["dep:sqlx"]

[dev-dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
