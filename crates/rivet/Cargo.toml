[package]
name = "rivet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The backend framework built only for coding agents."

[dependencies]
rivet-core = { workspace = true }
rivet-db = { workspace = true, optional = true }
rivet-agent = { workspace = true, optional = true }
rivet-mcp = { workspace = true, optional = true }

[features]
# Minimal by default: HTTP app only. Capabilities are opt-in so the dependency
# graph — and the surface an agent must understand — stays as small as the app.
default = []
db = ["dep:rivet-db"]
agent = ["dep:rivet-agent"]
mcp = ["dep:rivet-mcp", "agent"]
full = ["db", "agent", "mcp"]
