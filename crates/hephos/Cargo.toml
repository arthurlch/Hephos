[package]
name = "hephos"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The backend framework built only for coding agents."

[dependencies]
hephos-core = { workspace = true }
hephos-db = { workspace = true, optional = true }
hephos-agent = { workspace = true, optional = true }
hephos-mcp = { workspace = true, optional = true }

[features]
# Minimal by default: HTTP app only. Capabilities are opt-in so the dependency
# graph — and the surface an agent must understand — stays as small as the app.
default = []
db = ["dep:hephos-db"]
agent = ["dep:hephos-agent"]
mcp = ["dep:hephos-mcp", "agent"]
full = ["db", "agent", "mcp"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
