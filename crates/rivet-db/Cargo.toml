[package]
name = "rivet-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rivet database layer: Db and Tx over SQLx/Postgres."

[dependencies]
# `sqlx` feature gives `From<sqlx::Error> for rivet::Error`, so repos can use `?`.
rivet-core = { workspace = true, features = ["sqlx"] }
sqlx = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
