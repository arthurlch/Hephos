apiVersion: v1
kind: ConfigMap
metadata:
  name: hephos-config
data:
  HEPHOS_ADDR: "0.0.0.0:8080"
  HEPHOS_LOG: "info"
  HEPHOS_LOG_FORMAT: "json"
  HEPHOS_BODY_LIMIT_BYTES: "2097152"
  HEPHOS_TIMEOUT_SECS: "30"
  HEPHOS_RATE_LIMIT_RPS: "100"
  HEPHOS_RATE_LIMIT_BURST: "200"
  HEPHOS_CONCURRENCY_LIMIT: "1000"
  HEPHOS_MAX_CONNECTIONS: "5000"
  HEPHOS_DB_MAX_CONNECTIONS: "20"
  HEPHOS_DB_ACQUIRE_TIMEOUT_SECS: "5"
  HEPHOS_DB_STATEMENT_TIMEOUT_SECS: "15"
