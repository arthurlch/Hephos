services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hephos_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hephos_prod"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app-1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HEPHOS_ADDR: "0.0.0.0:8080"
      HEPHOS_LOG: "info"
      HEPHOS_LOG_FORMAT: "json"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/hephos_prod"
      JWT_SECRET: "production-grade-jwt-secret-at-least-32-bytes-long"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app-2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      HEPHOS_ADDR: "0.0.0.0:8080"
      HEPHOS_LOG: "info"
      HEPHOS_LOG_FORMAT: "json"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/hephos_prod"
      JWT_SECRET: "production-grade-jwt-secret-at-least-32-bytes-long"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-1
      - app-2
    restart: unless-stopped

volumes:
  pgdata:
